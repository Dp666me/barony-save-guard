name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/BaronySaveGuard.Tests -c Release

      - name: Build Windows app
        run: dotnet publish src/BaronySaveGuard.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/win

      - name: Build Linux console app
        run: dotnet publish src/BaronySaveGuard.Cli -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/linux

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE out/win
          Copy-Item README.md, LICENSE out/linux
          Compress-Archive -Path out/win/* -DestinationPath BaronySaveGuard-windows.zip
          tar -czf barony-save-guard-linux.tar.gz -C out/linux .

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} BaronySaveGuard-windows.zip barony-save-guard-linux.tar.gz --title "Barony Save Guard ${{ github.ref_name }}" --generate-notes

      - name: Keep downloads (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: |
            BaronySaveGuard-windows.zip
            barony-save-guard-linux.tar.gz
